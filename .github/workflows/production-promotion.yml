name: Production promotion gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-staging-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require the dedicated staging branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: test "$HEAD_BRANCH" = "codex/pathfinder-v2-staging"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.19.5
          package-manager-cache: false

      - name: Find the latest trusted three-service staging admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/staging-admission.yml/runs?per_page=1" \
            > "$RUNNER_TEMP/staging-admission-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/staging-admission.yml" \
            > "$RUNNER_TEMP/staging-admission-workflow.json"
          node scripts/promotion-admission-evidence.mjs select \
            --runs "$RUNNER_TEMP/staging-admission-runs.json" \
            --workflow "$RUNNER_TEMP/staging-admission-workflow.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$GITHUB_OUTPUT"

      - name: Read the trusted staging admission log
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_RUN_ID: ${{ steps.admission.outputs.run_id }}
        run: |
          gh run view "$ADMISSION_RUN_ID" --log --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/staging-admission.log"

      - name: Require the exact PR revision on all staging services
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/promotion-admission-evidence.mjs verify \
            --runs "$RUNNER_TEMP/staging-admission-runs.json" \
            --workflow "$RUNNER_TEMP/staging-admission-workflow.json" \
            --log "$RUNNER_TEMP/staging-admission.log" \
            --release-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY"

      - name: Require the exact PR revision to be healthy in staging
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/verify-staging-health.mjs \
            --url https://staging-web-staging-bbeb.up.railway.app/api/health \
            --expected-revision "$RELEASE_SHA" \
            --confirm-environment staging \
            --confirm-host staging-web-staging-bbeb.up.railway.app \
            --expected-database-resource 7bd81064-588f-48a5-b138-1fc86691a09b \
            --expected-redis-resource d53ab235-d403-4d7d-b525-3ace0ef07b92 \
            --expected-storage-resource 0a9b3c58-0c9e-47de-96ae-38df297996e8 \
            --timeout-ms 10000
