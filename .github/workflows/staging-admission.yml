name: Staging deployment admission

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: staging-admission
  cancel-in-progress: true

jobs:
  admit-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'codex/pathfinder-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4

      - name: Wait for exact three-service staging admission
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_READ_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "A staging-scoped Railway token is required for three-service readback."
            exit 1
          fi
          pnpm dlx @railway/cli@5.45.10 link \
            --project 8621111a-4ac8-4d88-9566-4627c8a02059 \
            --environment a7a394fc-aa4e-4a45-bd3c-904419a67818 \
            --service 9fec9bdb-1915-4bee-8213-f6c3d434baa1 --json > /dev/null
          topology="$RUNNER_TEMP/torchiko-staging-topology.json"
          for attempt in {1..60}; do
            if pnpm dlx @railway/cli@5.45.10 status --json > "$topology" && \
              pnpm staging:admit \
              --topology-file "$topology" \
              --url https://staging-web-staging-bbeb.up.railway.app/api/health \
              --expected-revision "$RELEASE_SHA" \
              --confirm-environment staging \
              --confirm-host staging-web-staging-bbeb.up.railway.app \
              --expected-database-resource 7bd81064-588f-48a5-b138-1fc86691a09b \
              --expected-redis-resource d53ab235-d403-4d7d-b525-3ace0ef07b92 \
              --expected-storage-resource 0a9b3c58-0c9e-47de-96ae-38df297996e8 \
              --timeout-ms 10000
            then
              exit 0
            fi
            sleep 15
          done

          echo "The exact web, dashboard and worker release did not pass admission in time."
          exit 1
