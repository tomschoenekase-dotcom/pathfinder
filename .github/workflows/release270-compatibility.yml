name: Release270 historical application compatibility

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  previous-app-schema270:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fictional_ci_password
          POSTGRES_DB: pathfinder_disposable_release270_compatibility
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: a18fde4b947561b70c1909c5df134ae3b1fef4e4
          path: previous
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Install each immutable checkout independently
        run: |
          pnpm --dir candidate install --frozen-lockfile
          pnpm --dir previous install --frozen-lockfile
      - name: Check guard and preservation assertions
        working-directory: candidate
        run: node --test scripts/release270-compatibility.test.mjs
      - name: Rehearse populated267 upgrade and historical application read-write
        run: node candidate/scripts/release270-compatibility.mjs previous "$RUNNER_TEMP/release270-compatibility"
        env:
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:fictional_ci_password@127.0.0.1:5432/pathfinder_disposable_release270_compatibility
          RELEASE270_COMPATIBILITY_CONFIRM: pathfinder_disposable_release270_compatibility
      - name: Preserve proof and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release270-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/release270-compatibility
          if-no-files-found: warn
          retention-days: 14
