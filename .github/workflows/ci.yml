name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pathfinder_disposable_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/pathfinder_disposable_ci
      DIRECT_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/pathfinder_disposable_ci
      REDIS_URL: redis://localhost:6379
      CLERK_SECRET_KEY: test_clerk_secret
      CLERK_PUBLISHABLE_KEY: test_clerk_pub
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      INTEGRATION_ENCRYPTION_KEY: test_encryption_key_32_chars_long!
      STORAGE_BUCKET: test-bucket
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      POSTHOG_API_KEY: test
      RESEND_API_KEY: test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:staging
      - run: pnpm verify:ai-boundary
      - run: pnpm verify:tenant-registry
      - run: pnpm verify:tenant-bypasses
      - run: pnpm verify:raw-sql
      - run: pnpm verify:tenant-procedures
      - run: pnpm verify:docker-context
      - run: pnpm verify:docker-context:effective
      - run: pnpm --dir packages/db db:generate
      - name: Apply migrations through the disposable-target guard
        run: pnpm db:migrate:disposable -- --database pathfinder_disposable_ci --confirm-database pathfinder_disposable_ci
        env:
          PATHFINDER_ALLOW_DISPOSABLE_MIGRATIONS: '1'
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/pathfinder_disposable_ci
      - name: Start disposable S3-compatible storage
        run: |
          docker run --name pathfinder-disposable-media-ci --detach \
            --publish 127.0.0.1:59000:9000 \
            --env MINIO_ROOT_USER=synthetic-access \
            --env MINIO_ROOT_PASSWORD=synthetic-secret \
            minio/minio@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb \
            server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:59000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs pathfinder-disposable-media-ci
          exit 1
      - name: Verify disposable media storage contract
        run: pnpm --dir packages/api exec vitest run src/lib/media-storage.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_MEDIA_STORAGE_INTEGRATION: '1'
          STORAGE_ENDPOINT: http://127.0.0.1:59000
          STORAGE_BUCKET: pathfinder-disposable-media-ci
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: synthetic-access
          STORAGE_SECRET_ACCESS_KEY: synthetic-secret
      - name: Remove disposable S3-compatible storage
        if: always()
        run: docker rm --force pathfinder-disposable-media-ci
      - name: Verify embedding database concurrency and recovery
        run: pnpm --dir packages/db exec vitest run src/helpers/embedding-work-claims.integration.test.ts src/helpers/embedding-dispatches.integration.test.ts src/helpers/embedding-claim-repair.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_EMBEDDING_DB_INTEGRATION: '1'
      - name: Verify analysis and report execution fencing under contention
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-execution-claims.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_EXECUTION_DB_INTEGRATION: '1'
      - name: Verify durable generation request dispatch leasing
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-request-dispatches.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_DISPATCH_DB_INTEGRATION: '1'
      - name: Verify durable generation API request idempotency
        run: pnpm --dir packages/api exec vitest run src/routers/admin/generation-request.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_REQUEST_DB_INTEGRATION: '1'
      - name: Verify expired generation recovery discovery
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-recovery.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_RECOVERY_DB_INTEGRATION: '1'
      - name: Verify generation recovery enqueue deduplication
        run: pnpm --dir packages/jobs exec vitest run src/generation-recovery.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RAILWAY_ENVIRONMENT: preview
          RUN_GENERATION_RECOVERY_REDIS_INTEGRATION: '1'
          PATHFINDER_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_disposable_generation_recovery
      - name: Verify generation dispatch enqueue deduplication
        run: pnpm --dir packages/jobs exec vitest run src/generation-dispatch.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RAILWAY_ENVIRONMENT: preview
          RUN_GENERATION_DISPATCH_REDIS_INTEGRATION: '1'
          PATHFINDER_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_disposable_generation_dispatch
      - name: Verify embedding freshness audit isolation
        run: pnpm --dir apps/workers exec vitest run src/lib/embedding-freshness.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_EMBEDDING_DB_INTEGRATION: '1'
      - name: Verify daily rollup logical uniqueness under contention
        run: pnpm --dir packages/db exec vitest run src/helpers/daily-rollup-uniqueness.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_ROLLUP_DB_INTEGRATION: '1'
      - name: Verify atomic venue content import rollback
        run: pnpm --dir packages/api exec vitest run src/routers/venue-import.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_VENUE_IMPORT_DB_INTEGRATION: '1'
      - name: Verify content history capture, isolation, and revert
        run: pnpm --dir packages/api exec vitest run src/routers/content-history.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_CONTENT_HISTORY_DB_INTEGRATION: '1'
      - name: Verify Clerk webhook receipt concurrency and rollback
        run: pnpm --dir packages/db exec vitest run src/helpers/membership-sync.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_CLERK_WEBHOOK_DB_INTEGRATION: '1'
      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run lint
      - run: pnpm turbo run test
      - run: pnpm test:scripts
