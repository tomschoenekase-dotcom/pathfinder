name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  # Merge queues and manual runs always execute the full suite (see the plan job).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Supersede stale runs on development branches only. Master, the staging release branch, the
# production promotion pull request and merge queues are never cancelled by a later push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/codex/pathfinder-v2-staging' && github.head_ref != 'codex/pathfinder-v2-staging' }}

jobs:
  # Dependency-aware change plan (docs/implementation/ci-optimization.md). Every uncertainty and
  # every release-bearing event requires full source qualification; an output is only ever skipped when it
  # is exactly 'false'. Required checks keep their names and always resolve through ci-required.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.reuse.outputs.mode || steps.plan.outputs.mode || steps.force.outputs.mode }}
      run_visitor_launch: ${{ steps.reuse.outputs.run_visitor_launch || steps.plan.outputs.run_visitor_launch || steps.force.outputs.run_visitor_launch }}
      run_database_integration: ${{ steps.reuse.outputs.run_database_integration || steps.plan.outputs.run_database_integration || steps.force.outputs.run_database_integration }}
      run_browser_gates: ${{ steps.reuse.outputs.run_browser_gates || steps.plan.outputs.run_browser_gates || steps.force.outputs.run_browser_gates }}
      run_workspace_graph: ${{ steps.reuse.outputs.run_workspace_graph || steps.plan.outputs.run_workspace_graph || steps.force.outputs.run_workspace_graph }}
      turbo_filters: ${{ steps.reuse.outputs.turbo_filters || steps.plan.outputs.turbo_filters || steps.force.outputs.turbo_filters }}
      reuse_verified: ${{ steps.reuse.outputs.reuse_verified }}
      evidence_tree: ${{ steps.reuse.outputs.evidence_tree }}
      evidence_run_id: ${{ steps.reuse.outputs.evidence_run_id }}
      evidence_recorded_at: ${{ steps.reuse.outputs.evidence_recorded_at }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          # setup-node v5 enables package-manager caching from package.json `packageManager`, which
          # needs pnpm on PATH. The classifier is plain node with no dependencies, so opt out.
          package-manager-cache: false
      - name: Look for fresh full CI on this identical source tree
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-ci-tree-evidence.mjs
      - name: Classify the complete change set
        id: plan
        if: ${{ steps.reuse.outputs.verified != 'true' && !((github.event_name != 'pull_request' && github.event_name != 'push') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/pathfinder-v2-staging' || github.head_ref == 'codex/pathfinder-v2-staging' || (github.event_name == 'pull_request' && github.base_ref != 'master')) }}
        continue-on-error: true
        env:
          PLAN_EVENT: ${{ github.event_name }}
          PLAN_REF: ${{ github.ref }}
          PLAN_HEAD_REF: ${{ github.head_ref }}
          PLAN_BASE_REF: ${{ github.base_ref }}
          PLAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/ci-change-plan.mjs \
            --event "$PLAN_EVENT" \
            --ref "$PLAN_REF" \
            --head-ref "$PLAN_HEAD_REF" \
            --base-ref "$PLAN_BASE_REF" \
            --base-sha "${PLAN_PR_BASE_SHA:-none}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Force the full suite for release-bearing runs
        id: force
        if: ${{ steps.reuse.outputs.verified != 'true' && ((github.event_name != 'pull_request' && github.event_name != 'push') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/pathfinder-v2-staging' || github.head_ref == 'codex/pathfinder-v2-staging' || (github.event_name == 'pull_request' && github.base_ref != 'master')) }}
        run: |
          {
            echo 'mode=full'
            echo 'run_visitor_launch=true'
            echo 'run_database_integration=true'
            echo 'run_browser_gates=true'
            echo 'run_workspace_graph=true'
            echo 'turbo_filters='
          } >> "$GITHUB_OUTPUT"

  railway-iac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter @torchiko/railway-iac... --frozen-lockfile
      - name: Verify Railway IaC source is complete and secret-safe
        run: pnpm verify:railway-iac-source
      - name: Verify Railway IaC fail-closed audit contracts
        run: node --test scripts/railway-iac-readiness.test.mjs

  visitor-launch:
    needs: plan
    # Skipped only when the plan proves no browser surface is affected (explicit 'false').
    if: ${{ !cancelled() && needs.plan.outputs.run_visitor_launch != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      DIRECT_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      REDIS_URL: redis://127.0.0.1:6379
      CLERK_SECRET_KEY: test_clerk_secret
      CLERK_PUBLISHABLE_KEY: test_clerk_pub
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      INTEGRATION_ENCRYPTION_KEY: test_encryption_key_32_chars_long!
      STORAGE_BUCKET: test-bucket
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      RESEND_API_KEY: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm characters:sync
      - name: Generate Prisma client for visitor media routes
        run: pnpm --dir packages/db db:generate
      - name: Install pinned visitor browser runtimes
        run: pnpm --dir apps/dashboard exec playwright install --with-deps chromium webkit
      - name: Verify visitor launch on compact, tablet, desktop and WebKit browsers
        run: pnpm --dir apps/dashboard test:visitor-launch-browser

  policy-and-integration:
    needs: plan
    # Always runs (never skipped): cheap policy checks and script tests apply to every change.
    # Heavy gates inside it are skipped only on an explicit 'false' from the plan.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pathfinder_disposable_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      DIRECT_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      REDIS_URL: redis://127.0.0.1:6379
      CLERK_SECRET_KEY: test_clerk_secret
      CLERK_PUBLISHABLE_KEY: test_clerk_pub
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      INTEGRATION_ENCRYPTION_KEY: test_encryption_key_32_chars_long!
      STORAGE_BUCKET: test-bucket
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      RESEND_API_KEY: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject high-severity production dependency advisories
        run: pnpm audit:prod
      - run: pnpm verify:staging
      - name: Verify exact-revision staging health admission contract
        run: node --test scripts/staging-health-admission.test.mjs
      - name: Verify exact-revision staging widget admission contract
        run: node --test scripts/staging-widget-admission.test.mjs
      - name: Verify reviewed public API surface inventory
        run: pnpm verify:public-surfaces
      - run: pnpm verify:ai-boundary
      - run: pnpm verify:ai-budget
      - run: pnpm verify:tenant-registry
      - run: pnpm verify:tenant-bypasses
      - run: pnpm verify:raw-sql
      - run: pnpm verify:source-encoding
      - run: pnpm verify:tenant-procedures
      - run: pnpm verify:docker-context
      - run: pnpm verify:docker-context:effective
      - run: pnpm --dir packages/db db:generate
      - name: Apply migrations through the disposable-target guard
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: |
          set -o pipefail
          migration_log="$(mktemp)"
          if ! pnpm db:migrate:disposable -- \
            --database pathfinder_disposable_ci \
            --confirm-database pathfinder_disposable_ci 2>&1 | tee "$migration_log"
          then
            while IFS= read -r line; do
              safe_line="${line//'%'/'%25'}"
              safe_line="${safe_line//$'\r'/'%0D'}"
              safe_line="${safe_line//$'\n'/'%0A'}"
              echo "::error title=Disposable migration failed::$safe_line"
            done < <(tail -n 30 "$migration_log")
            exit 1
          fi
        env:
          PATHFINDER_ALLOW_DISPOSABLE_MIGRATIONS: '1'
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      - name: Verify operator OAuth, grants, proposals and approvals on disposable PostgreSQL
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/operator/operator-oauth.disposable.integration.test.ts src/operator/operator.adversarial.test.ts src/operator/tools/operator-reads.disposable.integration.test.ts src/operator/kinds/operator-kinds.disposable.integration.test.ts src/operator/operator-routine-default.disposable.integration.test.ts src/operator/tools/crm-csv-import.disposable.integration.test.ts src/operator/tools/crm-merges.disposable.integration.test.ts src/operator/operator-decisions-grants.disposable.integration.test.ts src/correspondence/prisma-provider-draft-store.disposable.integration.test.ts --pool=forks --maxWorkers=1 --testTimeout=120000
        env:
          RUN_OPERATOR_DB_INTEGRATION: '1'
          RUN_CRM_CSV_IMPORT_DB_INTEGRATION: '1'
      - name: Verify CRM account merge plans and source preservation on disposable PostgreSQL
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/prospect-crm-disposable.integration.test.ts --pool=forks --maxWorkers=1 --testTimeout=120000
        env:
          RUN_PROSPECT_CRM_DB_INTEGRATION: '1'
      - name: Verify client MCP credential and venue appearance lifecycle
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/mcp/mcp-venue-appearance-disposable.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_MCP_VENUE_APPEARANCE_DB_INTEGRATION: '1'
          MCP_WRITE_TOOLS_ENABLED: 'true'
          AGENT_BRIDGE_HTTP_ENABLED: 'true'
      - name: Start disposable S3-compatible storage
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: |
          docker run --name pathfinder-disposable-media-ci --detach \
            --publish 127.0.0.1:59000:9000 \
            --env MINIO_ROOT_USER=synthetic-access \
            --env MINIO_ROOT_PASSWORD=synthetic-secret \
            bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:59000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs pathfinder-disposable-media-ci
          exit 1
      - name: Verify disposable media storage contract
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/lib/media-storage.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_MEDIA_STORAGE_INTEGRATION: '1'
          STORAGE_ENDPOINT: http://127.0.0.1:59000
          STORAGE_BUCKET: pathfinder-disposable-media-ci
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: synthetic-access
          STORAGE_SECRET_ACCESS_KEY: synthetic-secret
      - name: Remove disposable S3-compatible storage
        if: ${{ always() && needs.plan.outputs.run_database_integration != 'false' }}
        run: docker rm --force pathfinder-disposable-media-ci
      - name: Prove authoritative upload worker against fresh disposable infrastructure
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm test:intake-upload-verification:disposable
      - name: Verify embedding database concurrency and recovery
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/embedding-work-claims.integration.test.ts src/helpers/embedding-dispatches.integration.test.ts src/helpers/embedding-claim-repair.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_EMBEDDING_DB_INTEGRATION: '1'
      - name: Verify analysis and report execution fencing under contention
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-execution-claims.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_EXECUTION_DB_INTEGRATION: '1'
      - name: Verify durable generation request dispatch leasing
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-request-dispatches.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_DISPATCH_DB_INTEGRATION: '1'
      - name: Verify durable generation API request idempotency
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/routers/admin/generation-request.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_REQUEST_DB_INTEGRATION: '1'
      - name: Verify expired generation recovery discovery
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/generation-recovery.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_GENERATION_RECOVERY_DB_INTEGRATION: '1'
      - name: Verify generation recovery enqueue deduplication
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/jobs exec vitest run src/generation-recovery.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RAILWAY_ENVIRONMENT: preview
          RUN_GENERATION_RECOVERY_REDIS_INTEGRATION: '1'
          PATHFINDER_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_disposable_generation_recovery
      - name: Verify generation dispatch enqueue deduplication
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/jobs exec vitest run src/generation-dispatch.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RAILWAY_ENVIRONMENT: preview
          RUN_GENERATION_DISPATCH_REDIS_INTEGRATION: '1'
          PATHFINDER_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_disposable_generation_dispatch
      - name: Verify terminal job redrive fencing
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm test:redis:terminal-redrive
        env:
          PATHFINDER_ALLOW_EXISTING_DISPOSABLE_REDIS: '1'
          PATHFINDER_EXISTING_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_ci_owned_disposable_redis
      - name: Verify cross-replica media admission
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm test:redis:media-admission
        env:
          PATHFINDER_ALLOW_EXISTING_DISPOSABLE_REDIS: '1'
          PATHFINDER_EXISTING_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_ci_owned_disposable_redis
      - name: Verify complete live queue observability
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm test:redis:queue-observability
        env:
          PATHFINDER_ALLOW_EXISTING_DISPOSABLE_REDIS: '1'
          PATHFINDER_EXISTING_DISPOSABLE_REDIS_CONFIRMATION: pathfinder_ci_owned_disposable_redis
      - name: Verify embedding freshness audit isolation
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir apps/workers exec vitest run src/lib/embedding-freshness.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_EMBEDDING_DB_INTEGRATION: '1'
      - name: Verify daily rollup logical uniqueness under contention
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/daily-rollup-uniqueness.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_ROLLUP_DB_INTEGRATION: '1'
      - name: Verify atomic venue content import rollback
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/routers/venue-import.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_VENUE_IMPORT_DB_INTEGRATION: '1'
      - name: Verify content history capture, isolation, and revert
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/routers/content-history.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_CONTENT_HISTORY_DB_INTEGRATION: '1'
      - name: Verify venue-package atomic mutation, provenance, and rollback
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/api exec vitest run src/routers/venue-package.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_VENUE_PACKAGE_DB_INTEGRATION: '1'
      - name: Verify venue-package semantic duplicate isolation
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/venue-package-semantic-duplicates.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_VENUE_PACKAGE_SEMANTIC_DB_INTEGRATION: '1'
      - name: Verify venue-package semantic migration from legacy state
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: node --test scripts/venue-package-duplicate-analysis-migration.integration.test.mjs
        env:
          RUN_VENUE_PACKAGE_DUPLICATE_MIGRATION_INTEGRATION: '1'
          PATHFINDER_ALLOW_DISPOSABLE_MIGRATIONS: '1'
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
          PATHFINDER_DISPOSABLE_DATABASE: pathfinder_disposable_ci
      - name: Verify Clerk webhook receipt concurrency and rollback
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: pnpm --dir packages/db exec vitest run src/helpers/membership-sync.integration.test.ts --pool=forks --maxWorkers=1
        env:
          RUN_CLERK_WEBHOOK_DB_INTEGRATION: '1'
      - name: Synchronize reviewed character assets
        run: pnpm characters:sync
      - name: Build and verify browser bundles contain no server secrets
        if: ${{ needs.plan.outputs.run_browser_gates != 'false' }}
        env:
          # Match the dashboard Docker builder; all build/type/secret checks remain enabled.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm verify:client-bundles
      - name: Verify Packet 2 browser-surface DOM contracts
        if: ${{ needs.plan.outputs.run_browser_gates != 'false' }}
        run: pnpm test:browser-foundation
      - name: Verify Packet 2 automated accessibility contracts
        if: ${{ needs.plan.outputs.run_browser_gates != 'false' }}
        run: pnpm test:accessibility
      - name: Prove billing command races and recovery on disposable PostgreSQL
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        env:
          RUN_BILLING_COMMAND_DB_INTEGRATION: '1'
        run: pnpm --filter @pathfinder/billing exec vitest run src/agent-commands-disposable.integration.test.ts
      - run: pnpm test:scripts

  browser-gates:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    # Always runs (never skipped): cheap policy checks and script tests apply to every change.
    # Heavy gates inside it are skipped only on an explicit 'false' from the plan.
    if: ${{ !cancelled() && needs.plan.outputs.run_browser_gates != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pathfinder_disposable_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      DIRECT_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      REDIS_URL: redis://127.0.0.1:6379
      CLERK_SECRET_KEY: test_clerk_secret
      CLERK_PUBLISHABLE_KEY: test_clerk_pub
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      INTEGRATION_ENCRYPTION_KEY: test_encryption_key_32_chars_long!
      STORAGE_BUCKET: test-bucket
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      RESEND_API_KEY: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/db db:generate
      - name: Apply migrations through the disposable-target guard
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: |
          set -o pipefail
          migration_log="$(mktemp)"
          if ! pnpm db:migrate:disposable -- \
            --database pathfinder_disposable_ci \
            --confirm-database pathfinder_disposable_ci 2>&1 | tee "$migration_log"
          then
            while IFS= read -r line; do
              safe_line="${line//'%'/'%25'}"
              safe_line="${safe_line//$'\r'/'%0D'}"
              safe_line="${safe_line//$'\n'/'%0A'}"
              echo "::error title=Disposable migration failed::$safe_line"
            done < <(tail -n 30 "$migration_log")
            exit 1
          fi
        env:
          PATHFINDER_ALLOW_DISPOSABLE_MIGRATIONS: '1'
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      - run: pnpm characters:sync
      - name: Install the pinned Chromium runtime for visual smoke tests
        if: ${{ needs.plan.outputs.run_browser_gates != 'false' }}
        run: pnpm --dir apps/dashboard exec playwright install --with-deps chromium
      - name: Verify phone, tablet, and desktop core-product rendering
        if: ${{ needs.plan.outputs.run_browser_gates != 'false' }}
        env:
          VISUAL_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          visual_log="$(mktemp)"
          if ! pnpm test:visual-browser --shard="$VISUAL_SHARD" 2>&1 | tee "$visual_log"
          then
            while IFS= read -r line; do
              safe_line="${line//'%'/'%25'}"
              safe_line="${safe_line//$'\r'/'%0D'}"
              safe_line="${safe_line//$'\n'/'%0A'}"
              echo "::error title=Responsive browser gate failed::$safe_line"
            done < <(tail -n 80 "$visual_log")
            exit 1
          fi
      - name: Responsive browser shard complete
        run: echo "Responsive browser shard passed"

  workspace-checks:
    needs: plan
    # Tests must not wait behind the 6-8 minute typecheck. The matrix result is
    # successful only when both lanes pass; the protected aggregates still require it.
    strategy:
      fail-fast: false
      matrix:
        lane: [types-and-lint, tests]
    # Always runs (never skipped): cheap policy checks and script tests apply to every change.
    # Heavy gates inside it are skipped only on an explicit 'false' from the plan.
    if: ${{ !cancelled() && needs.plan.outputs.run_workspace_graph != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pathfinder_disposable_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      DIRECT_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      REDIS_URL: redis://127.0.0.1:6379
      CLERK_SECRET_KEY: test_clerk_secret
      CLERK_PUBLISHABLE_KEY: test_clerk_pub
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      INTEGRATION_ENCRYPTION_KEY: test_encryption_key_32_chars_long!
      STORAGE_BUCKET: test-bucket
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      RESEND_API_KEY: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/db db:generate
      - name: Apply migrations through the disposable-target guard
        if: ${{ needs.plan.outputs.run_database_integration != 'false' }}
        run: |
          set -o pipefail
          migration_log="$(mktemp)"
          if ! pnpm db:migrate:disposable -- \
            --database pathfinder_disposable_ci \
            --confirm-database pathfinder_disposable_ci 2>&1 | tee "$migration_log"
          then
            while IFS= read -r line; do
              safe_line="${line//'%'/'%25'}"
              safe_line="${safe_line//$'\r'/'%0D'}"
              safe_line="${safe_line//$'\n'/'%0A'}"
              echo "::error title=Disposable migration failed::$safe_line"
            done < <(tail -n 30 "$migration_log")
            exit 1
          fi
        env:
          PATHFINDER_ALLOW_DISPOSABLE_MIGRATIONS: '1'
          PATHFINDER_DISPOSABLE_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/pathfinder_disposable_ci
      - run: pnpm characters:sync
      - name: Run pnpm turbo run typecheck
        if: ${{ matrix.lane == 'types-and-lint' && needs.plan.outputs.run_workspace_graph != 'false' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PLAN_TURBO_FILTERS: ${{ needs.plan.outputs.turbo_filters }}
        # Unquoted on purpose: the plan emits validated `--filter=<workspace>` words only.
        run: pnpm turbo run typecheck $PLAN_TURBO_FILTERS
      - name: Run pnpm turbo run lint
        if: ${{ matrix.lane == 'types-and-lint' && needs.plan.outputs.run_workspace_graph != 'false' }}
        env:
          PLAN_TURBO_FILTERS: ${{ needs.plan.outputs.turbo_filters }}
        run: pnpm turbo run lint $PLAN_TURBO_FILTERS
      - name: Verify workspace test graph
        if: ${{ matrix.lane == 'tests' && needs.plan.outputs.run_workspace_graph != 'false' }}
        env:
          # Match the qualified typecheck budget for cold test transforms.
          # The wrapper runs fresh tests; required typechecks retain ^build.
          NODE_OPTIONS: --max-old-space-size=6144
          PATHFINDER_CI_TURBO_FILTERS: ${{ needs.plan.outputs.turbo_filters }}
        run: node scripts/run-ci-workspace-tests.mjs

  # Preserve the required ci check: it succeeds only after every original core gate passes.
  ci:
    needs: [plan, policy-and-integration, browser-gates, workspace-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Evaluate parallel core gate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required-gate.mjs --core

  # Always-running aggregate for branch protection. It fails if any required job failed, was
  # cancelled or was skipped without an explicit plan exclusion, so a skipped job can never leave
  # a required check silently green. Selective success is never release approval. Identical-tree reuse requires recent complete full CI; live admission and promotion remain separate.
  ci-required:
    needs:
      [
        plan,
        ci,
        railway-iac,
        visitor-launch,
        policy-and-integration,
        browser-gates,
        workspace-checks,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Evaluate required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required-gate.mjs
      - name: Record full-tree qualification for later identical merges
        id: tree-evidence
        if: ${{ needs.plan.outputs.mode == 'full' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/record-ci-tree-evidence.mjs
      - name: Retain bounded full-tree qualification
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-full-tree-${{ steps.tree-evidence.outputs.tree }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.tree-evidence.outputs.file }}
          if-no-files-found: error
          retention-days: 1
